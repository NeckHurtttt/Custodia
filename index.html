<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIFELINE: Rutina</title>
<meta name="description" content="Sobrevive a la rutina de la estación, esquiva a CUSTODIA y prepara tu regreso a la Tierra con protocolos reales de la NASA.">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><meta name="theme-color" content="#0b1020">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="barra">
  <span class="logo">LIFELINE<b>:RUTINA</b></span>
  <span id="dia">DÍA 1/10</span>
  <span id="reloj">05:40</span>
  <span id="bloque">—</span>
  <button id="btn-musica" class="mini" title="Música (M)">♪ MÚSICA</button>
  <button id="btn-ayuda">? AYUDA</button>
  <button id="btn-menu" title="Pausa y menú (Esc)">⏸ MENÚ [Esc]</button>
</header>
<main class="juego">
  <div class="izq">
  <section class="pantalla">
    <canvas id="lienzo" width="832" height="468"></canvas>
    <div id="aviso" hidden></div>
  </section>
  <section class="hudbar">
    <div class="hb hb-ia"><h3 id="t-alerta">IA · ALERTA</h3><div class="medidor alerta"><i id="m-alerta"></i></div><h3>INTEGRIDAD</h3><div class="medidor integ"><i id="m-integ"></i></div></div>
    <div class="hb stats" id="stats"></div>
    <div class="hb hb-acc"><small id="cap" hidden></small><div id="inv" class="inv" hidden></div><button id="btn-mochila">🎒 MOCHILA <kbd>I</kbd></button><button id="btn-fabricar">🔧 FABRICAR <kbd>C</kbd></button><button id="btn-usar">📡 INHIBIR <kbd>Q</kbd></button></div>
  </section>
  <section class="dock" id="dock"></section>
  </div>
  <aside class="panel">
    <div class="caja amenazas"><h3>AMENAZAS DE HOY</h3><ul id="amenazas"></ul></div>
    <ul id="plan" class="plan" hidden></ul>
    <div class="caja"><h3>TRIPULACIÓN</h3><ul id="crew" class="crew"></ul></div>
    <div class="caja"><h3>REGISTRO</h3><ul id="log" class="log"></ul></div>
  </aside>
</main>
<div id="tactil" class="tactil" hidden>
  <div class="cruz"><button data-d="u">▲</button><button data-d="l">◀</button><button data-d="r">▶</button><button data-d="d">▼</button></div>
  <div class="acciones"><button id="t-e">E</button><button id="t-f">F</button><button id="t-t">T</button><button id="t-sh">⇩</button><button id="t-q">Q</button><button id="t-i">I</button></div>
</div>
<div id="modal" class="modal" hidden><div class="ventana" id="ventana"></div></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
