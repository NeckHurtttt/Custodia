<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIFELINE: Rutina</title>
<meta name="description" content="Sobrevive a la rutina de la estación, esquiva a CUSTODIA y prepara tu regreso a la Tierra con protocolos reales de la NASA.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="barra">
  <span class="logo">LIFELINE<b>:RUTINA</b></span>
  <span id="dia">DÍA 1/10</span>
  <span id="reloj">05:40</span>
  <span id="bloque">—</span>
  <button id="btn-ayuda" class="mini">? AYUDA</button>
</header>
<main class="juego">
  <section class="pantalla">
    <canvas id="lienzo" width="704" height="416"></canvas>
    <div id="aviso" hidden></div>
  </section>
  <aside class="panel">
    <div class="caja">
      <h3>CUSTODIA · ALERTA</h3>
      <div class="medidor alerta"><i id="m-alerta"></i></div>
      <h3>INTEGRIDAD DE LA ESTACIÓN</h3>
      <div class="medidor integ"><i id="m-integ"></i></div>
    </div>
    <div class="caja stats" id="stats"></div>
    <div class="caja"><h3>INVENTARIO <small id="cap"></small></h3><div id="inv" class="inv"></div>
      <div class="botones"><button id="btn-fabricar">[C] FABRICAR</button><button id="btn-usar">[Q] INHIBIR</button></div></div>
    <div class="caja"><h3>PLAN DE REGRESO</h3><ul id="plan" class="plan"></ul></div>
    <div class="caja"><h3>REGISTRO</h3><ul id="log" class="log"></ul></div>
  </aside>
</main>
<div id="tactil" class="tactil" hidden>
  <div class="cruz"><button data-d="u">▲</button><button data-d="l">◀</button><button data-d="r">▶</button><button data-d="d">▼</button></div>
  <div class="acciones"><button id="t-e">E</button><button id="t-q">Q</button><button id="t-c">C</button></div>
</div>
<div id="modal" class="modal" hidden><div class="ventana" id="ventana"></div></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
